name: Build signed release APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify signing configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.SMS_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SMS_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SMS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SMS_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Set all four SMS signing secrets before running release."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sms-release.jks"
      - name: Build and sign release
        env:
          SMS_STORE_FILE: ${{ runner.temp }}/sms-release.jks
          SMS_STORE_PASSWORD: ${{ secrets.SMS_STORE_PASSWORD }}
          SMS_KEY_ALIAS: ${{ secrets.SMS_KEY_ALIAS }}
          SMS_KEY_PASSWORD: ${{ secrets.SMS_KEY_PASSWORD }}
        run: gradle --no-daemon --console=plain :app:assembleRelease :preview:assembleRelease
      - name: Verify both release APK signatures and permission-free preview
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          "$BUILD_TOOLS/apksigner" verify --verbose preview/build/outputs/apk/release/preview-release.apk
          "$BUILD_TOOLS/aapt" dump permissions preview/build/outputs/apk/release/preview-release.apk | tee preview-permissions.txt
          if grep -E 'android.permission.(READ_SMS|RECEIVE_SMS|SEND_SMS|READ_PHONE_STATE|READ_CONTACTS)' preview-permissions.txt; then
            echo "::error::Preview unexpectedly contains sensitive SMS or phone permissions"
            exit 1
          fi
          sha256sum app/build/outputs/apk/release/app-release.apk preview/build/outputs/apk/release/preview-release.apk > release-checksums.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: IING-STD-SMS-preview-safe
          path: |
            preview/build/outputs/apk/release/preview-release.apk
            preview-permissions.txt
            release-checksums.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: IING-STD-SMS-signed-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Prepare directly downloadable APK
        shell: bash
        run: |
          cp app/build/outputs/apk/release/app-release.apk IING-STD-SMS.apk
      - name: Publish APK directly in GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="sms-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" IING-STD-SMS.apk \
            --title "IING STD SMS build ${GITHUB_RUN_NUMBER}" \
            --notes "APK release bertanda tangan. Unduh IING-STD-SMS.apk langsung tanpa ekstrak ZIP. Build commit ${GITHUB_SHA}." \
            --target "$GITHUB_SHA" \
            --latest
