name: Build signed release APK
on:
  workflow_dispatch:
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify signing configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.SMS_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SMS_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SMS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SMS_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Set all four SMS signing secrets before running release."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sms-release.jks"
      - name: Build and sign release
        env:
          SMS_STORE_FILE: ${{ runner.temp }}/sms-release.jks
          SMS_STORE_PASSWORD: ${{ secrets.SMS_STORE_PASSWORD }}
          SMS_KEY_ALIAS: ${{ secrets.SMS_KEY_ALIAS }}
          SMS_KEY_PASSWORD: ${{ secrets.SMS_KEY_PASSWORD }}
        run: gradle --no-daemon --console=plain assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: IING-STD-SMS-signed-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
