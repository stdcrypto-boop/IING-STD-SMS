name: Build Android APK
on:
  push:
  workflow_dispatch:
concurrency:
  group: sms-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK with dependency retry
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Build attempt $attempt of 3"
            if gradle --no-daemon --console=plain assembleDebug; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "Build failed; waiting before retry..."
            sleep $((attempt * 45))
          done
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: IING-STD-SMS-debug
          path: app/build/outputs/apk/debug/*.apk
