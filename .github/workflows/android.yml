name: Build Android APK
on:
  push:
  workflow_dispatch:
concurrency:
  group: sms-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK with dependency retry
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Build attempt $attempt of 3"
            if gradle --no-daemon --console=plain assembleDebug; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "Build failed; waiting before retry..."
            sleep $((attempt * 45))
          done
      - name: Verify APK signature, manifest and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_DIR"
          BUILD_TOOLS="$(find "$SDK_DIR/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | head -n 8
          sha256sum "$APK" | tee app-debug.sha256
          echo "APK signature verified; SHA-256 checksum recorded."
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: IING-STD-SMS-debug
          path: |\n            app/build/outputs/apk/debug/*.apk\n            app-debug.sha256
